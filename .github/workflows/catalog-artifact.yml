name: Catalog artifact

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"
  push:
    branches:
      - development
    paths:
      - "supabase/tec-data/src/workflows/download_workflow.py"
      - "supabase/tec-data/src/workflows/process_workflow.py"
      - "supabase/tec-data/src/workflows/sync_pipeline.py"
      - "supabase/tec-data/src/workflows/sync_workflow.py"
      - ".github/workflows/catalog-artifact.yml"

jobs:
  build-catalog-artifact:
    name: Build catalog artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: development

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Download and process catalog
        working-directory: supabase/tec-data
        run: >-
          uv run tec-data pipeline
          --scope catalog
          --years 2026
          --data-dir data/raw

      - name: Build compressed catalog archive
        working-directory: supabase/tec-data
        run: >-
          tar -czf catalog-data.tar.gz
          data/raw/country/data.json
          data/raw/university/data.json
          data/raw/campus/data.json
          data/raw/academic_unit/data.json
          data/raw/academic_modality/data.json
          data/raw/academic_term/data.json
          data/raw/academic_unit_campus/data.json
          data/raw/study_plan/data.json
          data/raw/study_plan_campus/data.json
          data/raw/study_plan_level/data.json
          data/raw/course/data.json
          data/raw/study_plan_level_course/data.json
          data/raw/course_relation/data.json

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: tec-data-catalog-raw
          path: supabase/tec-data/catalog-data.tar.gz
          retention-days: 30
