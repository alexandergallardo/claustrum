name: Generate seed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  pull_request:
    paths:
      - "supabase/tec-data/**"
      - "supabase/migrations/**"
      - "supabase/seeds/tec-data/**"
      - ".github/workflows/generate-seed.yml"

jobs:
  seed-history-sync:
    name: Generate seed
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'development' }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Resolve latest catalog artifact run
        id: catalog_run
        uses: actions/github-script@v8
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'catalog-artifact.yml',
              branch: 'development',
              status: 'success',
              per_page: 1,
            });

            const run = response.data.workflow_runs[0];
            if (!run) {
              core.setFailed('No successful runs found for catalog-artifact.yml on development.');
              return;
            }

            core.setOutput('run_id', String(run.id));

      - name: Download latest catalog artifact
        uses: actions/download-artifact@v5
        with:
          name: tec-data-catalog-raw
          run-id: ${{ steps.catalog_run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: supabase/tec-data

      - name: Extract catalog artifact
        working-directory: supabase/tec-data
        run: |
          if [ -f "catalog-data.tar.gz" ]; then
            tar -xzf catalog-data.tar.gz
          elif [ -f "catalog-data/catalog-data.tar.gz" ]; then
            tar -xzf catalog-data/catalog-data.tar.gz
          else
            echo "catalog-data.tar.gz not found after artifact download"
            exit 1
          fi

      - name: Validate catalog artifact completeness
        working-directory: supabase/tec-data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/raw")
          required = [
              "campus",
              "academic_unit",
              "academic_term",
              "course",
              "academic_unit_campus",
              "study_plan",
          ]
          for table in required:
              path = root / table / "data.json"
              if not path.exists():
                  raise SystemExit(f"Missing required artifact file: {path}")

          campuses = json.loads((root / "campus" / "data.json").read_text())
          units = json.loads((root / "academic_unit" / "data.json").read_text())
          terms = json.loads((root / "academic_term" / "data.json").read_text())
          courses = json.loads((root / "course" / "data.json").read_text())

          term_keys_2026 = {
              str(row.get("external_key", ""))
              for row in terms
              if int(row.get("year", 0)) == 2026
          }

          if len(campuses) < 20:
              raise SystemExit(f"Catalog artifact looks incomplete: campus={len(campuses)}")
          if len(units) < 70:
              raise SystemExit(f"Catalog artifact looks incomplete: academic_unit={len(units)}")
          if len(courses) < 3000:
              raise SystemExit(f"Catalog artifact looks incomplete: course={len(courses)}")
          if len(term_keys_2026) < 35:
              raise SystemExit(
                  "Catalog artifact looks incomplete: missing many 2026 academic terms"
              )

          print(
              "Catalog artifact validated:",
              f"campus={len(campuses)}",
              f"academic_unit={len(units)}",
              f"course={len(courses)}",
              f"terms_2026={len(term_keys_2026)}",
          )
          PY

      - name: Run seed-history smoke sync
        working-directory: supabase/tec-data
        run: >-
          uv run tec-data sync
          --target seed-history
          --seed-dir ../seeds/tec-data
          --scope offering
          --years 2026
          --no-apply
          --keep-sql
          --seed-history-db-url postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - name: Cleanup catalog artifact files
        working-directory: supabase/tec-data
        run: |
          rm -f catalog-data.tar.gz
          rm -f catalog-data/catalog-data.tar.gz
          rm -rf catalog-data

      - name: Capture generated seed path
        id: generated_seed
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          seed_dir = Path("supabase/seeds/tec-data")
          seeds = sorted(seed_dir.glob("seed_*.sql"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not seeds:
              raise SystemExit("No generated seed SQL file found")

          latest_sql = seeds[0]
          latest_manifest = latest_sql.with_suffix(".json")
          if not latest_manifest.exists():
              raise SystemExit(f"Manifest for generated seed not found: {latest_manifest}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"seed_sql={latest_sql}\n")
              out.write(f"seed_manifest={latest_manifest}\n")
          PY

      - name: Detect non-noop seed changes
        id: seed_check
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path(os.environ["SEED_MANIFEST_PATH"])
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          noop = bool(payload.get("noop", False))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"create_pr={'true' if not noop else 'false'}\n")
              out.write(f"seed_file={payload.get('seed_file', '')}\n")

          print(f"Manifest: {manifest_path.name}")
          print(f"Seed file: {payload.get('seed_file', '')}")
          print(f"Noop: {noop}")
          PY
        env:
          SEED_MANIFEST_PATH: ${{ steps.generated_seed.outputs.seed_manifest }}

      - name: Create pull request with generated seeds
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.seed_check.outputs.create_pr == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(tec-data): weekly offering seed 2026"
          branch: "bot/tec-data-seed-2026"
          branch-suffix: "timestamp"
          base: "development"
          delete-branch: true
          title: "chore(tec-data): weekly offering seed update (2026)"
          body: |
            Automated weekly tec-data seed generation for scope `offering` and years `2026`.
            - target: `seed-history`
            - source: GitHub Actions
          add-paths: |
            supabase/seeds/tec-data/*.sql
            supabase/seeds/tec-data/*.json
