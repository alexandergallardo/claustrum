<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Claustrum - Gestión de horarios académicos" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111" />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      html {
        background: oklch(1 0 0);
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        html {
          background: oklch(0.145 0 0);
          color-scheme: dark;
        }
      }

      body {
        margin: 0;
        background: inherit;
      }
    </style>
    <script>
      (() => {
        try {
          const storageKey = "theme";
          const storedTheme = localStorage.getItem(storageKey);
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const resolvedTheme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : prefersDark
                ? "dark"
                : "light";

          const html = document.documentElement;
          html.classList.remove("light", "dark");
          html.classList.add(resolvedTheme);
          html.style.colorScheme = resolvedTheme;

          const backgroundColor = resolvedTheme === "dark" ? "oklch(0.145 0 0)" : "oklch(1 0 0)";
          const fallbackThemeColor = resolvedTheme === "dark" ? "#111111" : "#ffffff";
          html.style.backgroundColor = backgroundColor;

          const themeColorMetas = document.querySelectorAll('meta[name="theme-color"]');
          themeColorMetas.forEach((meta) => meta.setAttribute("content", fallbackThemeColor));
        } catch {
          // no-op
        }
      })();
    </script>
    <title>Claustrum</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
